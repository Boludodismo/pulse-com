name: POD CRM CI

on:
  push:
    branches: [main, homologacao-2026-09-06]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Contact import matching
        run: pnpm exec vitest run server/contactImport/matching.test.ts

      - name: Reminder delivery regressions
        run: pnpm exec vitest run server/messaging.job-worker.test.ts server/messaging.automatic-reminders.test.ts server/messaging.job-claim.test.ts server/messaging.retry-guard.test.ts server/messaging/appointmentReminderSchedule.test.ts server/messaging.studio-clock.test.ts

      - name: Appointment conflict intervals
        run: pnpm exec vitest run server/appointmentTime.test.ts

      - name: Build
        env:
          VITE_AUTH_MODE: local
        run: pnpm build

      - name: Anamnese DOM regression
        run: |
          npm ci --prefix scripts/anamnese-dom-regression --no-audit --no-fund
          npm test --prefix scripts/anamnese-dom-regression
