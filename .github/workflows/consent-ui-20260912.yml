name: Isolated consent UI validation
on:
  push:
    branches: ['feature/autorizacoes-busca-agenda-2026-09-12']
    paths:
      - 'scripts/apply-consent-ui-20260912.py'
      - '.github/workflows/consent-ui-20260912.yml'
permissions:
  contents: write
concurrency:
  group: consent-ui-20260912
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Boludodismo/pulse-com' && github.ref == 'refs/heads/feature/autorizacoes-busca-agenda-2026-09-12'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INTELLIGENT_INBOX_ENABLED: 'false'
      SCHEDULER_MODE: 'disabled'
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          npm install -g pnpm@10.4.1
          pnpm install --frozen-lockfile
      - name: Record pre-existing type diagnostics
        run: pnpm check
      - name: Apply hash-guarded source changes
        run: |
          python3 scripts/apply-consent-ui-20260912.py
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, before, after, expected=1):
              p = Path(path)
              text = p.read_text()
              assert text.count(before) == expected, (path, before, text.count(before))
              p.write_text(text.replace(before, after))
          edit('server/routers/messaging.ts', '))).where(and(\n        eq(clients.studioId, integration.studioId),', ')).where(and(\n        eq(clients.studioId, integration.studioId),')
          controls = 'client/src/components/WhatsappConsentControls.tsx'
          edit(controls, 'busy = false, source }: {', 'busy = false, source, onBusyChange }: {')
          edit(controls, 'busy?: boolean; source: string;', 'busy?: boolean; source: string; onBusyChange?: (busy: boolean) => void;')
          edit(controls, '  const enabled = isWhatsappConsentEnabled(contact);', '  useEffect(() => {\n    onBusyChange?.(save.isPending);\n    return () => onBusyChange?.(false);\n  }, [save.isPending, onBusyChange]);\n  const enabled = isWhatsappConsentEnabled(contact);')
          edit(controls, 'ClientWhatsappConsent({ clientId, studioId, enabled }: {', 'ClientWhatsappConsent({ clientId, studioId, enabled, onBusyChange }: {')
          edit(controls, 'clientId: number; studioId: number | null; enabled: boolean;', 'clientId: number; studioId: number | null; enabled: boolean; onBusyChange?: (busy: boolean) => void;')
          edit(controls, 'source="agendamento_autorizado_pelo_gestor" />', 'source="agendamento_autorizado_pelo_gestor" onBusyChange={onBusyChange} />')
          modal = 'client/src/components/EventModal.tsx'
          edit(modal, '  const consentStudioId = ', '  const [consentSaving, setConsentSaving] = useState(false);\n  const consentStudioId = ')
          edit(modal, 'if (createClientMutation.isPending) { toast.error("Finalize o cadastro do cliente antes de salvar o agendamento."); return; }', 'if (createClientMutation.isPending || consentSaving) { toast.error("Finalize o cadastro e a autorização antes de salvar o agendamento."); return; }')
          edit(modal, 'if (createClientMutation.isPending) return;', 'if (createClientMutation.isPending || consentSaving) return;')
          edit(modal, 'enabled={isOpen && !createClientMutation.isPending} />', 'enabled={isOpen && !createClientMutation.isPending} onBusyChange={setConsentSaving} />')
          p = Path(modal)
          text = p.read_text().replace('disabled={createClientMutation.isPending}', 'disabled={createClientMutation.isPending || consentSaving}')
          p.write_text(text)
          PY
      - name: Test consent helpers and source integration guards
        run: pnpm exec vitest run server/whatsappConsentUi.test.ts
      - name: Validate TypeScript
        run: pnpm check
      - name: Build without starting the application
        run: pnpm build
      - name: Commit only reviewed source paths to the feature branch
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/MessagingCenter.tsx client/src/components/EventModal.tsx server/routers/messaging.ts shared/whatsappConsentUi.ts client/src/components/WhatsappConsentControls.tsx server/whatsappConsentUi.test.ts
          git commit -m 'Add searchable client consents and explicit authorization in appointment forms'
          git push origin HEAD:refs/heads/feature/autorizacoes-busca-agenda-2026-09-12
