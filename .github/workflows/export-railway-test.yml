name: Export Railway Test Branch

on:
  push:
    branches:
      - railway-teste-sistema-novo
    paths:
      - .github/workflows/export-railway-test.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pack repository
        run: |
          zip -qr /tmp/pulse-branch.zip . -x '.git/*'
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-branch
          path: /tmp/pulse-branch.zip
          retention-days: 1
