name: Apply Railway deploy fixes

on:
  push:
    branches: [homologacao-final-2026-09-06]

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.event.head_commit.message != 'Finaliza correcoes de deploy Railway'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: homologacao-final-2026-09-06
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Apply surgical fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}")
              p.write_text(text.replace(old, new, 1))

          # 1) Local auth must never eagerly build an OAuth URL.
          replace_once(
              'client/src/_core/hooks/useAuth.ts',
              '  const { redirectOnUnauthenticated = false, redirectPath = getLoginUrl() } =\n    options ?? {};',
              '  const { redirectOnUnauthenticated = false, redirectPath } = options ?? {};',
          )
          replace_once(
              'client/src/_core/hooks/useAuth.ts',
              '    if (typeof window === "undefined") return;\n    if (window.location.pathname === redirectPath) return;\n\n    window.location.href = redirectPath',
              '    if (typeof window === "undefined") return;\n    if ((import.meta.env.VITE_AUTH_MODE as string) === "local" && !redirectPath) return;\n    const target = redirectPath ?? getLoginUrl();\n    if (window.location.pathname === target) return;\n\n    window.location.href = target',
          )

          # 2) Bootstrap an initial studio and link the local superadmin.
          replace_once(
              'server/_core/localAuth.ts',
              'import bcrypt from "bcryptjs";',
              'import bcrypt from "bcryptjs";\nimport { randomBytes } from "node:crypto";\nimport { studios } from "../../drizzle/schema";',
          )
          replace_once(
              'server/_core/localAuth.ts',
              '  ownerOpenId: string;\n}): Promise<void> {',
              '  ownerOpenId: string;\n  studioName: string;\n}): Promise<void> {',
          )
          replace_once(
              'server/_core/localAuth.ts',
              '''    const existing = await db.getUserByEmail(env.email.trim().toLowerCase());\n    const passwordHash = await bcrypt.hash(env.password, SALT_ROUNDS);\n\n    if (!existing) {\n      // Create fresh admin\n      await db.createUser({\n        openId: env.ownerOpenId || `local-admin-${Date.now()}`,\n        name: env.name,\n        email: env.email.trim().toLowerCase(),\n        role: "superadmin",\n        passwordHash,\n      });\n      console.log(`[LocalAuth] Admin user created: ${env.email}`);\n    } else if (!existing.passwordHash) {\n      // Existing user without password — set it (preserve existing role)\n      await db.updateUser(existing.id, { passwordHash });\n      console.log(`[LocalAuth] Password set for existing admin: ${env.email}`);\n    } else {\n      // Admin already exists with password — do NOT overwrite\n      console.log(`[LocalAuth] Admin already configured: ${env.email}`);\n    }''',
              '''    const normalizedEmail = env.email.trim().toLowerCase();\n    const existing = await db.getUserByEmail(normalizedEmail);\n    const passwordHash = await bcrypt.hash(env.password, SALT_ROUNDS);\n\n    const studio = await db.getFirstStudio();\n    let studioId = existing?.studioId ?? studio?.id ?? null;\n    if (!studioId) {\n      const database = await db.getDb();\n      if (!database) throw new Error("Banco de dados indisponível ao criar o estúdio inicial.");\n      const result = await database.insert(studios).values({\n        name: env.studioName.trim() || "Meu Estúdio",\n        email: normalizedEmail,\n        masterKey: randomBytes(32).toString("hex"),\n        isActive: 1,\n      });\n      studioId = Number(result[0].insertId);\n      console.log(`[LocalAuth] Bootstrap studio created: ${env.studioName} (#${studioId})`);\n    }\n\n    if (!existing) {\n      await db.createUser({\n        openId: env.ownerOpenId || `local-admin-${Date.now()}`,\n        name: env.name,\n        email: normalizedEmail,\n        role: "superadmin",\n        studioId,\n        passwordHash,\n      });\n      console.log(`[LocalAuth] Admin user created: ${env.email}`);\n    } else {\n      const updates: { passwordHash?: string; studioId?: number } = {};\n      if (!existing.passwordHash) updates.passwordHash = passwordHash;\n      if (!existing.studioId) updates.studioId = studioId;\n      if (Object.keys(updates).length > 0) {\n        await db.updateUser(existing.id, updates);\n        console.log(`[LocalAuth] Existing admin bootstrap completed: ${env.email}`);\n      } else {\n        console.log(`[LocalAuth] Admin already configured: ${env.email}`);\n      }\n    }''',
          )

          # 3) Deployment environment: studio, scheduler and canonical public URL.
          replace_once(
              'server/_core/env.ts',
              '  localAdminName: process.env.LOCAL_ADMIN_NAME ?? "Admin",',
              '  localAdminName: process.env.LOCAL_ADMIN_NAME ?? "Admin",\n  localStudioName: process.env.LOCAL_STUDIO_NAME ?? "Meu Estúdio",\n  schedulerMode: (process.env.SCHEDULER_MODE ?? (process.env.AUTH_MODE === "local" ? "local" : "heartbeat")).toLowerCase(),',
          )

          # 4) Standalone scheduler fallback while keeping the heartbeat endpoint.
          replace_once(
              'server/scheduler.ts',
              'import { enqueueDueIndividualReminders, runAutomaticMessageCycle } from "./messaging/automaticReminders";',
              'import { enqueueDueIndividualReminders, runAutomaticMessageCycle } from "./messaging/automaticReminders";\nimport { processPendingIntegrationJobs } from "./messaging/service";',
          )
          replace_once(
              'server/scheduler.ts',
              '  return process.env.PUBLIC_URL || "https://tatuei.com";',
              '  return process.env.PUBLIC_URL || process.env.APP_BASE_URL ||\n    (process.env.RAILWAY_PUBLIC_DOMAIN ? `https://${process.env.RAILWAY_PUBLIC_DOMAIN}` : "https://crm.tatuei.com");',
          )
          replace_once(
              'server/scheduler.ts',
              '''/** Mantida como API compatível para chamadas legadas; não inicia timers locais. */\nexport function startScheduler() {\n  console.log("[Scheduler] Rotinas locais desativadas; use Heartbeat para processar notificações.");\n}\n''',
              '''let standaloneSchedulerStarted = false;\nlet standaloneSchedulerRunning = false;\n\nasync function runStandaloneSchedulerCycle() {\n  if (standaloneSchedulerRunning) return;\n  standaloneSchedulerRunning = true;\n  try {\n    await runLegacyNotificationCycle();\n    await processPendingIntegrationJobs(20);\n  } catch (error) {\n    console.error("[Scheduler] Falha no ciclo standalone:", error);\n  } finally {\n    standaloneSchedulerRunning = false;\n  }\n}\n\nexport function startScheduler() {\n  if (standaloneSchedulerStarted) return;\n  standaloneSchedulerStarted = true;\n  console.log("[Scheduler] Iniciando processamento standalone a cada 60 segundos.");\n  setTimeout(() => void runStandaloneSchedulerCycle(), 10_000);\n  setInterval(() => void runStandaloneSchedulerCycle(), 60_000);\n}\n''',
          )

          replace_once(
              'server/_core/index.ts',
              'import { runLegacyNotificationCycle } from "../scheduler";',
              'import { runLegacyNotificationCycle, startScheduler } from "../scheduler";',
          )
          replace_once(
              'server/_core/index.ts',
              '      ownerOpenId: ENV.ownerOpenId,\n    });',
              '      ownerOpenId: ENV.ownerOpenId,\n      studioName: ENV.localStudioName,\n    });',
          )
          replace_once(
              'server/_core/index.ts',
              '''      const baseUrl = process.env.APP_BASE_URL ||\n        (process.env.NODE_ENV === "production"\n          ? `https://${process.env.VITE_APP_ID ? "tatuei.com" : "tatuei.manus.space"}`\n          : "http://localhost:3000");''',
              '''      const baseUrl = ENV.appBaseUrl ||\n        (process.env.NODE_ENV === "production" ? "https://crm.tatuei.com" : "http://localhost:3000");''',
          )
          replace_once(
              'server/_core/index.ts',
              '''  server.listen(port, "0.0.0.0", () => {\n    console.log(`Server running on http://0.0.0.0:${port}`);\n    console.log("[Scheduler] Processamento periódico disponível via Heartbeat.");\n  });''',
              '''  server.listen(port, "0.0.0.0", () => {\n    console.log(`Server running on http://0.0.0.0:${port}`);\n    if (ENV.schedulerMode === "local") {\n      startScheduler();\n    } else {\n      console.log("[Scheduler] Processamento periódico configurado para Heartbeat externo.");\n    }\n  });''',
          )

          # 5) Fresh Railway DB: use consolidated baseline 0014, not the duplicated historical chain.
          Path('server/_core/migrations.ts').write_text('''import "dotenv/config";\nimport { readFile } from "node:fs/promises";\nimport { resolve } from "node:path";\nimport mysql, { type RowDataPacket } from "mysql2/promise";\n\ntype JournalEntry = { idx: number; tag: string };\ntype MigrationJournal = { entries: JournalEntry[] };\nconst DEFAULT_BASELINE_INDEX = 14;\n\nfunction splitStatements(sqlText: string): string[] {\n  const withoutLineComments = sqlText\n    .split("\\n")\n    .filter(line => !line.trimStart().startsWith("--"))\n    .join("\\n");\n  return withoutLineComments\n    .split("--> statement-breakpoint")\n    .flatMap(chunk => chunk.split(";"))\n    .map(statement => statement.trim())\n    .filter(statement => statement.length > 0);\n}\n\nexport async function runStartupMigrations(): Promise<void> {\n  if (process.env.RUN_DB_MIGRATIONS !== "true") return;\n  const databaseUrl = process.env.DATABASE_URL?.trim();\n  if (!databaseUrl) throw new Error("RUN_DB_MIGRATIONS=true but DATABASE_URL is not configured.");\n  const baselineIndex = Number.parseInt(process.env.MIGRATION_BASELINE_INDEX ?? String(DEFAULT_BASELINE_INDEX), 10);\n  const connection = await mysql.createConnection(databaseUrl);\n  try {\n    await connection.execute(`CREATE TABLE IF NOT EXISTS podcrm_migrations (tag varchar(255) NOT NULL, appliedAt timestamp NOT NULL DEFAULT CURRENT_TIMESTAMP, PRIMARY KEY (tag))`);\n    const [appliedRows] = await connection.query<RowDataPacket[]>("SELECT tag FROM podcrm_migrations");\n    const applied = new Set(appliedRows.map(row => String(row.tag)));\n    const [schemaRows] = await connection.query<RowDataPacket[]>("SELECT COUNT(*) AS count FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'users'");\n    const existingSchema = Number(schemaRows[0]?.count ?? 0) > 0;\n    if (applied.size === 0 && existingSchema) {\n      console.log("[Database] Existing schema detected without POD CRM migration tracking; startup replay skipped for safety.");\n      return;\n    }\n    const journal = JSON.parse(await readFile(resolve(process.cwd(), "drizzle/meta/_journal.json"), "utf8")) as MigrationJournal;\n    const entries = journal.entries.filter(entry => entry.idx >= baselineIndex).sort((a, b) => a.idx - b.idx);\n    console.log(`[Database] Applying POD CRM migrations from baseline index ${baselineIndex}...`);\n    for (const entry of entries) {\n      if (applied.has(entry.tag)) continue;\n      const sqlText = await readFile(resolve(process.cwd(), `drizzle/${entry.tag}.sql`), "utf8");\n      for (const statement of splitStatements(sqlText)) await connection.query(statement);\n      await connection.execute("INSERT INTO podcrm_migrations (tag) VALUES (?)", [entry.tag]);\n      console.log(`[Database] Applied migration ${entry.tag}`);\n    }\n    console.log("[Database] POD CRM schema is up to date.");\n  } finally {\n    await connection.end();\n  }\n}\n''')

          migration = Path('drizzle/0016_bootstrap_studios.sql')
          migration.write_text('''CREATE TABLE `studios` (\n\t`id` int AUTO_INCREMENT NOT NULL,\n\t`name` varchar(255) NOT NULL,\n\t`email` varchar(320),\n\t`phone` varchar(20),\n\t`address` text,\n\t`city` varchar(100),\n\t`state` varchar(50),\n\t`zipCode` varchar(20),\n\t`masterKey` varchar(64) NOT NULL,\n\t`isActive` tinyint NOT NULL DEFAULT 1,\n\t`createdAt` timestamp NOT NULL DEFAULT (now()),\n\t`updatedAt` timestamp NOT NULL DEFAULT (now()) ON UPDATE CURRENT_TIMESTAMP,\n\tCONSTRAINT `studios_id` PRIMARY KEY(`id`),\n\tCONSTRAINT `studios_masterKey_unique` UNIQUE(`masterKey`)\n);\n--> statement-breakpoint\nALTER TABLE `appointments` ADD `studioId` int NOT NULL;\n--> statement-breakpoint\nALTER TABLE `artists` ADD `studioId` int NOT NULL;\n--> statement-breakpoint\nALTER TABLE `auditLogs` ADD `studioId` int;\n--> statement-breakpoint\nALTER TABLE `clients` ADD `studioId` int NOT NULL;\n--> statement-breakpoint\nALTER TABLE `transactions` ADD `studioId` int NOT NULL;\n--> statement-breakpoint\nALTER TABLE `users` MODIFY COLUMN `role` enum('superadmin','admin','collaborator') NOT NULL DEFAULT 'collaborator';\n--> statement-breakpoint\nALTER TABLE `users` ADD `studioId` int;\n''')

          journal_path = Path('drizzle/meta/_journal.json')
          journal = json.loads(journal_path.read_text())
          if not any(entry.get('idx') == 16 for entry in journal['entries']):
              position = next(i for i, entry in enumerate(journal['entries']) if entry.get('idx') == 17)
              journal['entries'].insert(position, {
                  'idx': 16,
                  'version': '5',
                  'when': 1768304500000,
                  'tag': '0016_bootstrap_studios',
                  'breakpoints': True,
              })
          journal_path.write_text(json.dumps(journal, ensure_ascii=False, indent=2) + '\n')

          # 6) Docker must not execute Drizzle files directly as MySQL init scripts.
          p = Path('docker-compose.yml')
          text = p.read_text().replace('      - ./drizzle:/docker-entrypoint-initdb.d:ro\n', '')
          text = text.replace('      DATABASE_URL: mysql://${DB_USER:-podcrm}:${DB_PASS:-podcrm123}@db:3306/${DB_NAME:-podcrm}\n', '      DATABASE_URL: mysql://${DB_USER:-podcrm}:${DB_PASS:-podcrm123}@db:3306/${DB_NAME:-podcrm}\n      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-true}\n      MIGRATION_BASELINE_INDEX: ${MIGRATION_BASELINE_INDEX:-14}\n')
          text = text.replace('      LOCAL_ADMIN_NAME: ${LOCAL_ADMIN_NAME:-Admin}\n', '      LOCAL_ADMIN_NAME: ${LOCAL_ADMIN_NAME:-Admin}\n      LOCAL_STUDIO_NAME: ${LOCAL_STUDIO_NAME:-Meu Estúdio}\n      SCHEDULER_MODE: ${SCHEDULER_MODE:-local}\n')
          text = text.replace('      VITE_APP_LOGO: ${VITE_APP_LOGO:-}\n', '      VITE_APP_LOGO: ${VITE_APP_LOGO:-}\n      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}\n      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}\n')
          p.write_text(text)

          p = Path('.env.example')
          text = p.read_text().replace('RUN_DB_MIGRATIONS=true\n', 'RUN_DB_MIGRATIONS=true\nMIGRATION_BASELINE_INDEX=14\n')
          text = text.replace('LOCAL_ADMIN_NAME=Administrador\n', 'LOCAL_ADMIN_NAME=Administrador\nLOCAL_STUDIO_NAME=Meu Estúdio\nSCHEDULER_MODE=local\n')
          text = text.replace('# Example: https://your-service.up.railway.app\n# Railway also exposes RAILWAY_PUBLIC_DOMAIN automatically after a domain exists.\nAPP_BASE_URL=\nPUBLIC_URL=', '# Domínio público previsto para este projeto. Durante a homologação você também pode usar o domínio gerado pelo Railway.\nAPP_BASE_URL=https://crm.tatuei.com\nPUBLIC_URL=https://crm.tatuei.com')
          p.write_text(text)

          p = Path('Dockerfile')
          p.write_text(p.read_text().replace("http://localhost:8080/", "http://localhost:8080/api/health"))

          # Temporary automation removes itself from the final branch.
          Path('.github/workflows/fix-railway-deploy.yml').unlink()
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build
        env:
          VITE_AUTH_MODE: local
        run: pnpm build

      - name: Commit validated fixes
        run: |
          git config user.name "chatgpt-deploy-fix"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finaliza correcoes de deploy Railway"
          git push origin HEAD:homologacao-final-2026-09-06
