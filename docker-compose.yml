version: '3.8'

services:
  # MySQL database
  db:
    image: mysql:8.0
    container_name: podcrm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-podcrm}
      MYSQL_USER: ${DB_USER:-podcrm}
      MYSQL_PASSWORD: ${DB_PASS:-podcrm123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./drizzle:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # POD CRM application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podcrm_app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Database
      DATABASE_URL: mysql://${DB_USER:-podcrm}:${DB_PASS:-podcrm123}@db:3306/${DB_NAME:-podcrm}
      
      # Auth mode
      AUTH_MODE: ${AUTH_MODE:-local}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-admin@podcrm.local}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-admin123}
      LOCAL_ADMIN_NAME: ${LOCAL_ADMIN_NAME:-Admin}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      
      # Storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-disabled}
      BUILT_IN_FORGE_API_URL: ${BUILT_IN_FORGE_API_URL:-}
      BUILT_IN_FORGE_API_KEY: ${BUILT_IN_FORGE_API_KEY:-}
      
      # OAuth (only needed if AUTH_MODE=oauth)
      VITE_APP_ID: ${VITE_APP_ID:-}
      OAUTH_SERVER_URL: ${OAUTH_SERVER_URL:-}
      VITE_OAUTH_PORTAL_URL: ${VITE_OAUTH_PORTAL_URL:-}
      OWNER_OPEN_ID: ${OWNER_OPEN_ID:-}
      OWNER_NAME: ${OWNER_NAME:-}
      
      # App config
      NODE_ENV: production
      PORT: 8080
      VITE_APP_TITLE: ${VITE_APP_TITLE:-POD CRM}
      VITE_APP_LOGO: ${VITE_APP_LOGO:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db_data:
    driver: local
